[pytest]
# pytest 配置文件
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记注册
markers =
    e2e: E2E 端到端测试 (需要浏览器)
    slow: 慢速测试
    smoke: 冒烟测试 (快速核心功能验证)

# 输出配置
addopts = -v --tb=short --strict-markers
console_output_style = progress

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S