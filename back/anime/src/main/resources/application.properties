# 服务器配置
server.port=8080

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/anime?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# JPA配置
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none

# 执行SQL脚本
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:sql_data/schema.sql

# 文件上传配置
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# 热部署配置
spring.devtools.restart.enabled=true

# 允许循环依赖（SecurityConfig ↔ JwtAuthenticationFilter ↔ UserService）
spring.main.allow-circular-references=true

spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.devtools.restart.exclude=static/**,public/**

# 本地存储配置
local.storage.videoPath=C:/Users/22294/Videos/mp4
local.storage.avatarPath=C:/Users/22294/Pictures/avatars
local.storage.coverPath=C:/Users/22294/Pictures/covers

# 本地存储访问URL
local.storage.baseUrl=http://localhost:8080

# JWT配置
jwt.secret-key=your-secret-key
# 24小时
jwt.access-token-expiration=86400000
# 7天
jwt.refresh-token-expiration=604800000
